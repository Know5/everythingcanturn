[project]
name = "convcore"
version = "0.2.0"
description = "Universal file conversion engine: capability registry + format graph search"
requires-python = ">=3.11"
dependencies = [
    # The core registry and raster codecs work with these small dependencies.
    # Other domains are lazy-loaded and are available through extras below.
    # puremagic 2.x 要求 Python >= 3.12；1.30 是仍支持 3.11 的最后一线。
    # 代码只用 magic_string()，1.30 与 2.x 行为实测一致（全量测试两边都过）
    "puremagic>=1.30",
    "pillow>=11.0",
]

[project.optional-dependencies]
image = [
    "pillow-heif>=0.21",
    "psd-tools>=1.10",
]
raw = [
    "numpy>=2.1",
    "rawpy>=0.23",
]
vector = [
    "resvg-py>=0.5",
    "vtracer>=0.6",
]
document = [
    "pymupdf>=1.24",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "mistune>=3.0",
    "lxml>=5.0",
]
pdf2docx = [
    # pdf2docx pulls OpenCV for layout detection; keep this heavy dependency
    # out of the normal document extra.
    "pdf2docx>=0.5",
    "opencv-python-headless>=4.5",
]
data = [
    "PyYAML>=6.0",
    "tomli-w>=1.0",
    "openpyxl>=3.1",
    "lxml>=5.0",
    "pyarrow>=14.0",
    "pdfplumber>=0.11",
]
archive = [
    "py7zr>=1.0",
    "rarfile>=4.2",
]
font = [
    "fonttools>=4.50",
    "brotli>=1.1",
]
desktop = [
    "pywebview>=6.0",
]
all = [
    "pillow-heif>=0.21",
    "psd-tools>=1.10",
    "numpy>=2.1",
    "rawpy>=0.23",
    "resvg-py>=0.5",
    "vtracer>=0.6",
    "pymupdf>=1.24",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "mistune>=3.0",
    "pdf2docx>=0.5",
    "opencv-python-headless>=4.5",
    "PyYAML>=6.0",
    "tomli-w>=1.0",
    "openpyxl>=3.1",
    "lxml>=5.0",
    "pyarrow>=14.0",
    "pdfplumber>=0.11",
    "py7zr>=1.0",
    "rarfile>=4.2",
    "fonttools>=4.50",
    "brotli>=1.1",
    "pywebview>=6.0",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "build>=1.2",
    "reportlab>=4.0",
]

[project.scripts]
convcore = "convcore.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["convcore"]

[tool.hatch.build.targets.wheel.force-include]
"convcore/webui/static" = "convcore/webui/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
