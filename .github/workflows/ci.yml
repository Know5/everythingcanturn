name: CI

on:
  push:
    # 分支上直接跑：修复分支曾长期不跑 CI（main 落后 6 个提交时才被发现）
    branches: [main, "fix/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        # 桌面端前端（ui/）用 React + AntD，构建产物进包。
        # 放在 pytest 之前跑，是为了让 TypeScript 错误在 PR 阶段就暴露，
        # 而不是等到 release 流水线打包时才发现。
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build desktop UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        # 从干净环境安装：验证 pyproject extras 的声明完整性
        # （评审 P0-1 的回归防线——漏声明会在这一步直接失败）。
        # 用 requirements.lock.txt 约束版本：PyMuPDF 2.0 / Pillow 13 / ReportLab 5.1
        # 都曾让测试在 CI 上飘（表格检测、渲染基线），不能让 CI 随机拉最新版。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]" -c requirements.lock.txt

      - name: Cache FFmpeg engine
        # gyan.dev 偶尔 503；缓存成功安装的引擎，避免每个矩阵任务重复下载。
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/convcore/engines
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('convcore/engines/manifest.py') }}
          restore-keys: |
            ffmpeg-${{ runner.os }}-

      - name: Install FFmpeg engine
        # media 域测试需要 ffmpeg。走项目自己的引擎安装通道，
        # 顺带验证 engines install 在干净机器上的真实可用性。
        # 503 是上游 CDN 问题，批处理里再包一层退避重试。
        shell: pwsh
        run: |
          for ($i = 1; $i -le 5; $i++) {
            python -m convcore engines install ffmpeg --accept-hash
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt 5) { Start-Sleep -Seconds 20 }
          }
          exit 1

      - name: Show environment diagnostics
        run: python -m convcore doctor

      - name: Run tests
        run: python -m pytest --cov=convcore --cov-report=term-missing

      - name: Smoke test
        # 端到端冒烟：三种域各转一次，产物必须真实存在
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.new('RGB', (64, 64), 'red').save('t.png')"
          python -m convcore convert t.png -t webp -o t.webp --overwrite
          python -m convcore convert t.webp -t png -o t2.png --overwrite
          if (-not (Test-Path t.webp) -or -not (Test-Path t2.png)) { throw "smoke failed" }
          echo "smoke OK"

      - name: Desktop UI smoke
        # 桌面端加载哪个界面由 _ui_source 决定；构建产物存在时必须指向它，
        # 缺失时必须报错（不能静默加载别的东西，否则新前端坏了也发现不了）。
        shell: pwsh
        run: |
          python -c "from convcore.desktop.app import _ui_source; s=_ui_source(); assert 'url' in s, s; print(s['url'])"
